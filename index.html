<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enhanced Aliquot Search</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --purple:#6366f1;--purple-dark:#4f46e5;
      --green:#10b981;--green-dark:#059669;
      --blue:#3b82f6;--blue-dark:#2563eb;
      --red:#ef4444;--gray:#6b7280;
      --border:#e5e7eb;--bg:#f5f6fa;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:#111827;min-height:100vh;padding:20px}
    .container{max-width:1400px;margin:0 auto}

    /* Header */
    .header{margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
    .header h1{font-size:1.75rem;font-weight:700;color:#111}
    .user-badge{display:inline-flex;align-items:center;gap:6px;
      font-size:.8rem;padding:6px 12px;border-radius:20px;
      background:#ede9fe;color:#4f46e5;font-weight:500}
    .user-badge svg{width:14px;height:14px}

    /* Search Form */
    .search-card{background:#fff;border:1px solid var(--border);border-radius:12px;
      padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:16px;margin-bottom:16px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-label{font-size:.8rem;font-weight:600;color:#374151}
    .form-input,.form-select{padding:9px 12px;border:1px solid var(--border);
      border-radius:8px;font-size:.9rem;outline:none;transition:border-color .15s;
      background:#fff}
    .form-input:focus,.form-select:focus{border-color:var(--purple)}

    .checkbox-group{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
    .checkbox-label{display:flex;align-items:center;gap:6px;font-size:.85rem;
      color:#374151;cursor:pointer;user-select:none}
    .checkbox-label input[type="checkbox"]{cursor:pointer;width:16px;height:16px}

    .search-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
    button{padding:10px 20px;border:none;border-radius:8px;font-size:.875rem;
      font-weight:600;cursor:pointer;transition:all .15s;line-height:1}
    button:disabled{opacity:.45;cursor:not-allowed}
    .btn-primary{background:var(--purple);color:#fff}
    .btn-primary:hover:not(:disabled){background:var(--purple-dark)}
    .btn-secondary{background:#f3f4f6;color:#374151}
    .btn-secondary:hover:not(:disabled){background:#e5e7eb}

    /* Status */
    .status{padding:10px 14px;border-radius:8px;font-size:.85rem;
      margin-top:12px;display:none}
    .status.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;display:block}
    .status.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:block}
    .status.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}

    .hidden{display:none!important}

    /* Results heading */
    .results-heading{font-size:.8rem;font-weight:600;color:#6b7280;text-transform:uppercase;
      letter-spacing:.05em;margin-bottom:8px}

    /* Table */
    .bio-table{background:#fff;border:1px solid var(--border);border-radius:12px;
      overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .table-cols{grid-template-columns:40px 36px 1fr 150px 160px 180px 220px}
    .table-header{display:grid;padding:0 16px;border-bottom:1px solid var(--border);background:#f9fafb}
    .table-header .th{padding:10px 8px;font-size:.75rem;font-weight:600;color:#6b7280;
      text-transform:uppercase;letter-spacing:.04em}
    .bio-row{border-bottom:1px solid var(--border)}
    .bio-row:last-child{border-bottom:none}
    .row-main{display:grid;padding:0 16px;align-items:center;cursor:default;
      transition:background .1s;min-height:48px}
    .row-main:hover{background:#fafafa}
    .row-main.saved-row{background:#faf5ff}

    /* Save checkbox */
    .save-cb{appearance:none;width:18px;height:18px;border:2px solid var(--border);
      border-radius:4px;cursor:pointer;transition:all .15s;flex-shrink:0;position:relative;
      display:inline-block}
    .save-cb:checked{background:var(--purple);border-color:var(--purple)}
    .save-cb:checked::after{content:'✓';position:absolute;color:#fff;font-size:11px;
      font-weight:700;top:50%;left:50%;transform:translate(-50%,-50%)}
    .save-cb:hover:not(:checked){border-color:var(--purple)}

    /* Expand chevron */
    .expand-btn{background:none;border:none;cursor:pointer;padding:4px;color:#9ca3af;
      font-size:1rem;line-height:1;border-radius:4px;transition:all .15s;display:flex;
      align-items:center;justify-content:center}
    .expand-btn:hover{background:#f3f4f6;color:#374151}
    .expand-btn.open{transform:rotate(90deg);color:#6366f1}

    /* Row cells */
    .td{padding:8px;font-size:.85rem;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .td-wrap{white-space:normal;overflow:visible;text-overflow:unset}
    .td a{color:var(--blue);text-decoration:none;font-weight:600}
    .td a:hover{text-decoration:underline}
    .td-muted{color:#6b7280;font-size:.8rem}
    .type-badge{display:inline-block;padding:2px 8px;border-radius:4px;
      background:#e0e7ff;color:#4338ca;font-size:.72rem;font-weight:600}

    /* Detail panel */
    .row-detail{background:#eff6ff;border-top:1px solid #bfdbfe;padding:20px 24px}
    .detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 24px}
    .detail-field{display:flex;flex-direction:column;gap:2px}
    .detail-label{font-size:.72rem;color:#6b7280;font-weight:500}
    .detail-value{font-size:.85rem;color:#111827;word-break:break-word}
    .detail-value a{color:var(--blue);text-decoration:none}
    .detail-value a:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div>
      <h1>Enhanced Aliquot Search</h1>
    </div>
    <div class="user-badge" id="userBadge" style="display:none">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <span id="userEmail">—</span>
    </div>
  </div>

  <!-- Authentication Section (Always Visible) -->
  <div class="search-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:.9rem;font-weight:600;color:#374151">🔐 Authentication</div>
      <div class="user-badge" id="userBadgeTop" style="display:none;margin:0">
        <span id="userEmailTop">—</span>
      </div>
    </div>
    <p style="font-size:.85rem;color:#6b7280;margin-bottom:12px">
      Paste your CF_Authorization token from
      <a href="https://aliquot.txgmesh.net" target="_blank" style="color:#6366f1">aliquot.txgmesh.net</a>
      (DevTools → Application → Cookies → CF_Authorization)
    </p>
    <div style="display:flex;gap:8px">
      <input type="password" id="cfTokenInput" placeholder="Paste CF_Authorization token here..."
             style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:monospace">
      <button class="btn-primary" onclick="saveCFToken()">Set Token</button>
    </div>
    <div class="status" id="authStatus"></div>
  </div>

  <!-- Search Form -->
  <div class="search-card">
    <form id="searchForm" onsubmit="doSearch(event)">
      <div class="form-grid">
        <!-- Biospecimen ID/Name -->
        <div class="form-group">
          <label class="form-label" for="specimenName">Biospecimen ID / Name</label>
          <input type="text" id="specimenName" class="form-input"
                 placeholder="e.g. 24-15515-LU-5">
        </div>

        <!-- Biospecimen Type -->
        <div class="form-group">
          <label class="form-label" for="bioSpecimenType">Biospecimen Type</label>
          <select id="bioSpecimenType" class="form-select">
            <option value="">All Types</option>
            <option value="FFPE_BLOCK">FFPE Block</option>
            <option value="FROZEN_OCT_BLOCK">Frozen OCT Block</option>
            <option value="TISSUE_MICROARRAY">Tissue Microarray</option>
          </select>
        </div>

        <!-- Tissue Type -->
        <div class="form-group">
          <label class="form-label" for="tissueType">Tissue Type</label>
          <select id="tissueType" class="form-select">
            <option value="">All Tissue Types</option>
          </select>
        </div>

        <!-- Disease Type -->
        <div class="form-group">
          <label class="form-label" for="diseaseType">Disease Type</label>
          <select id="diseaseType" class="form-select">
            <option value="">All Disease Types</option>
          </select>
        </div>
      </div>

      <!-- Checkboxes -->
      <div class="form-group">
        <label class="form-label">Include Only (optional filters)</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="hasInventoryLocations">
            <span>Has Inventory Locations</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="hasImageLinks">
            <span>Has Image Links</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="hasExperiments">
            <span>Has Experiments</span>
          </label>
        </div>
      </div>

      <!-- Actions -->
      <div class="search-actions">
        <button type="button" class="btn-secondary" onclick="clearForm()">Clear</button>
        <button type="submit" class="btn-primary" id="searchBtn">Search</button>
      </div>
    </form>

    <div class="status" id="searchStatus"></div>
  </div>

  <!-- Results -->
  <div id="resultsHeading" class="results-heading hidden"></div>
  <div id="resultsContainer" class="results-container hidden"></div>

</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────
let userEmail = '';
let userName = '';
let cfToken = localStorage.getItem('cf_token') || '';
let savedBlocks = JSON.parse(localStorage.getItem('saved_blocks') || '{}');

// ─── Save / Unsave ────────────────────────────────────────────────────────
function toggleSave(id, encodedRecord) {
  const record = JSON.parse(decodeURIComponent(encodedRecord));
  if (savedBlocks[id]) {
    delete savedBlocks[id];
  } else {
    savedBlocks[id] = record;
  }
  localStorage.setItem('saved_blocks', JSON.stringify(savedBlocks));
  // Update card border
  const card = document.getElementById(`card-${id}`);
  if (card) card.classList.toggle('saved', !!savedBlocks[id]);
}

function showSavedBlocks() {
  const heading = document.getElementById('resultsHeading');
  const container = document.getElementById('resultsContainer');
  const saved = Object.values(savedBlocks);
  if (!saved.length) {
    heading.textContent = '';
    heading.classList.add('hidden');
    container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:40px">No saved blocks yet — check the box on any result to save it here.</p>';
    container.classList.remove('hidden');
    return;
  }
  heading.textContent = `Saved Blocks (${saved.length})`;
  heading.classList.remove('hidden');
  renderResults(saved);
}

// ─── Authentication ───────────────────────────────────────────────────────
function saveCFToken() {
  const token = document.getElementById('cfTokenInput').value.trim();
  if (!token) {
    setStatus('authStatus', 'Please enter a token', 'err');
    return;
  }

  cfToken = token;
  localStorage.setItem('cf_token', token);

  // Set as cookie for server-side auth
  document.cookie = `CF_Authorization=${token}; path=/; SameSite=Lax`;

  setStatus('authStatus', '✓ Token saved! Refreshing...', 'ok');
  setTimeout(() => window.location.reload(), 1000);
}

async function checkAuth() {
  // Check if we have CF token (from cookie or localStorage)
  const hasCookieToken = document.cookie.includes('CF_Authorization=');
  const hasLocalToken = !!cfToken;

  if (!hasCookieToken && hasLocalToken) {
    // Restore token to cookie
    document.cookie = `CF_Authorization=${cfToken}; path=/; SameSite=Lax`;
  }

  try {
    const res = await fetch('/api/whoami', { credentials: 'include' });
    const { email, name, source } = await res.json();

    if (email) {
      setUser(email, name);
      // Show authenticated status in the auth section
      document.getElementById('userBadgeTop').style.display = 'inline-flex';
      document.getElementById('userEmailTop').textContent = email;
      setStatus('authStatus', `✓ Authenticated as ${email}`, 'ok');
      return true;
    }
  } catch { /* continue */ }

  return false;
}

// ─── Identity ─────────────────────────────────────────────────────────────
function setUser(email, name) {
  userEmail = email || '';
  userName = name || '';
  const badge = document.getElementById('userBadge');
  if (userEmail) {
    document.getElementById('userEmail').textContent = userName || userEmail;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  loadTissueTypes();
  loadDiseaseTypes();
  showSavedBlocks();
});

async function loadDiseaseTypes() {
  try {
    const res = await fetch('/api/diseasetypes', { credentials: 'include', headers: cfToken ? { 'X-CF-Token': cfToken } : {} });
    const data = await res.json();
    console.log('Disease types raw response:', JSON.stringify(data).slice(0, 500));
    const types = Array.isArray(data) ? data : (data.data || []);
    console.log('Disease types count:', types.length, 'sample:', types[0]);
    const active = types.filter(t => !t.status || t.status === 'ACTIVE').sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    const select = document.getElementById('diseaseType');
    active.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.name;
      opt.textContent = t.name;
      select.appendChild(opt);
    });
  } catch (e) {
    console.warn('Failed to load disease types:', e);
  }
}

async function loadTissueTypes() {
  try {
    const res = await fetch('/api/tissuetypes', { credentials: 'include', headers: cfToken ? { 'X-CF-Token': cfToken } : {} });
    const data = await res.json();
    const types = Array.isArray(data) ? data : (data.data || []);
    const active = types.filter(t => t.status === 'ACTIVE').sort((a, b) => a.name.localeCompare(b.name));
    const select = document.getElementById('tissueType');
    active.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.name;
      opt.textContent = t.name;
      select.appendChild(opt);
    });
  } catch (e) {
    console.warn('Failed to load tissue types:', e);
  }
}

// ─── Search ───────────────────────────────────────────────────────────────
async function doSearch(event) {
  event?.preventDefault();

  const params = new URLSearchParams();

  const name = document.getElementById('specimenName').value.trim();
  if (name) params.append('q', name);

  const type = document.getElementById('bioSpecimenType').value;
  if (type) params.append('bioSpecimenType', type);

  const tissue = document.getElementById('tissueType').value.trim();
  if (tissue) params.append('tissueType', tissue);

  const disease = document.getElementById('diseaseType').value.trim();
  if (disease) params.append('diseaseType', disease);

  if (document.getElementById('hasInventoryLocations').checked)
    params.append('hasInventoryLocations', 'true');
  if (document.getElementById('hasImageLinks').checked)
    params.append('hasImageLinks', 'true');
  if (document.getElementById('hasExperiments').checked)
    params.append('hasExperiments', 'true');

  setStatus('searchStatus', 'Searching…', 'info');
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('resultsContainer').classList.add('hidden');

  try {
    const url = `/api/search?${params.toString()}`;
    const res = await fetch(url, { credentials: 'include', headers: cfToken ? { 'X-CF-Token': cfToken } : {} });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    let results = data.results || [];

    // If "Has Image Links" is checked, filter by checking detail endpoint
    if (document.getElementById('hasImageLinks').checked && results.length > 0) {
      setStatus('searchStatus', `Checking which specimens have images...`, 'info');
      results = await filterByImages(results);
    }

    // Filter out inactive specimens
    results = results.filter(r => r.status !== 'INACTIVE');

    // Only fetch inventory if checkbox is checked
    if (document.getElementById('hasInventoryLocations').checked && results.length > 0) {
      setStatus('searchStatus', `Fetching inventory locations for ${results.length} result(s)…`, 'info');
      results = await fetchInventoryLocations(results);
    }

    const heading = document.getElementById('resultsHeading');
    heading.textContent = `Search Results (${results.length})`;
    heading.classList.remove('hidden');
    renderResults(results);
    setStatus('searchStatus',
      `Found ${results.length} biospecimen${results.length === 1 ? '' : 's'}`, 'ok');
  } catch(e) {
    setStatus('searchStatus', `Error: ${e.message}`, 'err');
    document.getElementById('resultsContainer').classList.add('hidden');
  } finally {
    document.getElementById('searchBtn').disabled = false;
  }
}

// ─── Fetch Inventory Locations ────────────────────────────────────────────
async function fetchInventoryLocations(records) {
  const promises = records.map(async (r) => {
    try {
      const res = await fetch(`/api/biospecimens/${r.id}/inventory`, {
        credentials: 'include',
        headers: cfToken ? { 'X-CF-Token': cfToken } : {}
      });
      const inv = res.ok ? await res.json() : null;
      console.log(`Inventory for ${r.name}:`, JSON.stringify(inv));
      const locations = Array.isArray(inv) ? inv : (inv?.data || []);
      // Only keep locations that have boxHierarchy.boxName or boxHierarchy.rackName
      r.inventoryLocations = locations.filter(loc => loc.boxHierarchy?.boxName || loc.boxHierarchy?.rackName);
    } catch (e) {
      console.warn('Failed to fetch inventory for', r.name, e);
      r.inventoryLocations = [];
    }
    return r;
  });

  const results = await Promise.all(promises);
  return results.filter(r => r.inventoryLocations.length > 0);
}

// ─── Filter by Images ─────────────────────────────────────────────────────
async function filterByImages(records) {
  const checks = records.map(async (r) => {
    // Check if image exists in additionalProperties
    if (r.additionalProperties && r.additionalProperties.Image) {
      return r;
    }

    // If not in list response, check detail endpoint (parent might have it)
    try {
      const res = await fetch(`/api/biospecimens/${r.id}`, { credentials: 'include', headers: cfToken ? { 'X-CF-Token': cfToken } : {} });
      if (!res.ok) return null;

      const detail = await res.json();

      // Check if this specimen or its parent has an image
      const hasImage =
        (detail.additionalProperties && detail.additionalProperties.Image) ||
        (detail.parentBioSpecimen && detail.parentBioSpecimen.additionalProperties && detail.parentBioSpecimen.additionalProperties.Image);

      if (hasImage) {
        // Update record with image data
        if (detail.parentBioSpecimen && detail.parentBioSpecimen.additionalProperties && detail.parentBioSpecimen.additionalProperties.Image) {
          r.additionalProperties = r.additionalProperties || {};
          r.additionalProperties.Image = detail.parentBioSpecimen.additionalProperties.Image;
        }
        return r;
      }
      return null;
    } catch (e) {
      console.warn('Failed to check image for', r.name, e);
      return null;
    }
  });

  const results = await Promise.all(checks);
  return results.filter(r => r !== null);
}

// ─── Expand/Collapse ──────────────────────────────────────────────────────
function toggleExpand(id) {
  const detail = document.getElementById(`detail-${id}`);
  const btn = document.getElementById(`expand-${id}`);
  const isOpen = !detail.classList.contains('hidden');
  detail.classList.toggle('hidden', isOpen);
  btn.classList.toggle('open', !isOpen);
}

// ─── Render Results ───────────────────────────────────────────────────────
function renderResults(results) {
  const container = document.getElementById('resultsContainer');

  if (!results.length) {
    container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:40px">No results found</p>';
    container.classList.remove('hidden');
    return;
  }

  const cols = 'table-cols';
  container.innerHTML = `
    <div class="bio-table">
      <div class="table-header table-cols ${cols}">
        <div class="th"></div>
        <div class="th"></div>
        <div class="th">BioSpecimen ID</div>
        <div class="th">Type</div>
        <div class="th">Tissue Types</div>
        <div class="th">Disease Type</div>
        <div class="th">Inventory Location</div>
      </div>
      ${results.map((r) => {
        const aliquotUrl = `https://aliquot.txgmesh.net/biospecimen/${r.id || r.name}`;
        const heImage = findHEImage(r);
        const isSaved = !!savedBlocks[r.id];
        const encodedRecord = encodeURIComponent(JSON.stringify(r));
        const tissue = r.tissueTypes?.map(t => t.name).join(', ') || '—';
        const disease = r.diseaseType?.name || (Array.isArray(r.diseaseType) ? r.diseaseType.map(d=>d.name||d).join(', ') : '') || '—';
        const inv = r.inventoryLocations?.length ? formatInventory(r.inventoryLocations) : '<span style="color:#9ca3af">—</span>';

        return `
          <div class="bio-row" id="card-${r.id}">
            <div class="row-main table-cols${isSaved ? ' saved-row' : ''}">
              <div class="td" style="display:flex;align-items:center">
                <input type="checkbox" class="save-cb" id="save-${r.id}"
                  ${isSaved ? 'checked' : ''}
                  onchange="toggleSave('${r.id}', '${encodedRecord}')">
              </div>
              <div class="td" style="display:flex;align-items:center">
                <button class="expand-btn" id="expand-${r.id}" onclick="toggleExpand('${r.id}')">›</button>
              </div>
              <div class="td">
                <a href="${aliquotUrl}" target="_blank">${r.name || r.id}</a>
                ${heImage ? `&nbsp;<a href="${heImage}" target="_blank" style="font-size:.75rem;color:#6366f1;font-weight:400">[H&amp;E ↗]</a>` : ''}
              </div>
              <div class="td">${r.bioSpecimenType ? `<span class="type-badge">${formatType(r.bioSpecimenType)}</span>` : '—'}</div>
              <div class="td td-muted">${tissue}</div>
              <div class="td td-muted">${disease}</div>
              <div class="td td-wrap">${inv}</div>
            </div>
            <div class="row-detail hidden" id="detail-${r.id}">
              <div class="detail-grid">
                <div class="detail-field"><span class="detail-label">BioSpecimen ID</span><span class="detail-value" style="font-family:monospace">${r.name || r.id}</span></div>
                <div class="detail-field"><span class="detail-label">Type</span><span class="detail-value">${r.bioSpecimenType || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Status</span><span class="detail-value">${r.status || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Tissue Types</span><span class="detail-value">${tissue}</span></div>
                <div class="detail-field"><span class="detail-label">Disease Type</span><span class="detail-value">${disease}</span></div>
                <div class="detail-field"><span class="detail-label">Primary Diagnosis</span><span class="detail-value">${r.primaryDiagnosis || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Cell Types</span><span class="detail-value">${r.cellTypes?.map(c=>c.name||c).join(', ') || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Vendor</span><span class="detail-value">${r.vendor?.name || r.vendorName || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Owner</span><span class="detail-value">${r.owner || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Experiments</span><span class="detail-value">${r.experiments?.length ? r.experiments.length + ' experiment(s)' : '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Lot Number</span><span class="detail-value">${r.lotNumber || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Donor ID</span><span class="detail-value">${r.donorId || r.additionalProperties?.DonorId || '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Receipt Date</span><span class="detail-value">${r.receiptDate ? r.receiptDate.slice(0,10) : '—'}</span></div>
                <div class="detail-field"><span class="detail-label">Updated At</span><span class="detail-value">${r.updatedAt ? r.updatedAt.slice(0,10) : '—'}</span></div>
                ${r.inventoryLocations?.length ? `<div class="detail-field"><span class="detail-label">Inventory Location</span><span class="detail-value">${formatInventory(r.inventoryLocations)}</span></div>` : ''}
                ${heImage ? `<div class="detail-field"><span class="detail-label">H&amp;E Image</span><span class="detail-value"><a href="${heImage}" target="_blank">View H&amp;E Image ↗</a></span></div>` : ''}
                ${r.additionalProperties?.userNotes ? `<div class="detail-field" style="grid-column:1/-1"><span class="detail-label">Notes</span><span class="detail-value">${JSON.stringify(r.additionalProperties.userNotes)}</span></div>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  container.classList.remove('hidden');
}

// ─── Helpers ──────────────────────────────────────────────────────────────
function findHEImage(record) {
  // Check additionalProperties.Image first (primary location)
  if (record.additionalProperties && record.additionalProperties.Image) {
    return record.additionalProperties.Image;
  }

  // Fallback to imageLinks array if it exists
  const imageLinks = record.imageLinks;
  if (!imageLinks || !Array.isArray(imageLinks)) return null;

  // Look for H&E image in the image category
  const heImage = imageLinks.find(img =>
    img.category === 'image' &&
    (img.description?.toLowerCase().includes('h&e') ||
     img.description?.toLowerCase().includes('he '))
  );

  if (heImage) return heImage.url || heImage.link;

  // Fallback to first image in 'image' category
  const firstImage = imageLinks.find(img => img.category === 'image');
  return firstImage ? (firstImage.url || firstImage.link) : null;
}

function formatInventory(locations) {
  if (!locations || locations.length === 0)
    return '<span style="color:#9ca3af">Not in inventory</span>';

  return locations.map(loc => {
    if (typeof loc === 'string') return `<span style="color:#059669;font-weight:600">${loc}</span>`;
    const h = loc.boxHierarchy || {};
    const parts = [];
    if (h.rackName) parts.push(`Drawer: <strong>${h.rackName}</strong>`);
    if (h.boxName)  parts.push(`Column: <strong>${h.boxName}</strong>`);
    return parts.length
      ? `<span style="color:#059669">${parts.join(' &nbsp;·&nbsp; ')}</span>`
      : `<span style="color:#9ca3af">—</span>`;
  }).join('<br>');
}

function extractDiseases(record) {
  const diseases = [];
  if (record.diseaseType) {
    if (Array.isArray(record.diseaseType)) {
      diseases.push(...record.diseaseType.map(d => typeof d === 'string' ? d : d.name));
    } else if (typeof record.diseaseType === 'string') {
      diseases.push(record.diseaseType);
    } else if (record.diseaseType.name) {
      diseases.push(record.diseaseType.name);
    }
  }
  if (record.primaryDiagnosis && !diseases.includes(record.primaryDiagnosis)) {
    diseases.push(record.primaryDiagnosis);
  }
  return diseases.filter(Boolean).slice(0, 3); // Limit to 3 tags
}

function formatType(type) {
  return type.replace(/_/g, ' ')
    .toLowerCase()
    .replace(/\b\w/g, c => c.toUpperCase());
}

function clearForm() {
  document.getElementById('searchForm').reset();
  setStatus('searchStatus', '', '');
  showSavedBlocks();
}

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `status ${type}`;
}
</script>
